name: Build README

on:
  push:
    branches: [main]
    paths:
      - profile.yml
      - projects.yml
      - templates/**
      - scripts/**
      - assets/projects/**
      - .github/workflows/build-readme.yml
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate README
        run: python scripts/build_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md assets/; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/banner-light.svg assets/banner-dark.svg
          git commit -m "chore: rebuild profile README"
          git push
